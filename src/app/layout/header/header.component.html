<header class="main-header" [class.scrolled]="scrolled">
  <div class="header-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo">
      <img [src]="homeSettings?.main_logo ? apiService.storageUrl + homeSettings.main_logo : 'assets/aazhi_logo_nobg.png'" 
           [alt]="(homeSettings?.website_name || 'Aazhi Foundation') + ' Logo'" 
           class="brand-logo" />
      <span class="logo-text">{{ homeSettings?.website_name || 'Aazhi Foundation' }}</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav" role="navigation" aria-label="Main Navigation">
      <ul>
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
        </li>

        <li>
          <a routerLink="/about-us" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">About Us</a>
        </li>

        <li>
          <a routerLink="/gallery" routerLinkActive="active">Gallery</a>
        </li>

        <li>
          <a routerLink="/impact-stories" routerLinkActive="active">Impact Stories</a>
        </li>
        <li>
          <a routerLink="/get-involved" routerLinkActive="active">Get Involved</a>
        </li>
        <li>
          <a routerLink="/blog" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Blog</a>
        </li>
        <li>
          <a routerLink="/contact" routerLinkActive="active">Contact</a>
        </li>
      </ul>
    </nav>

    <!-- CTA Donate -->
    <div class="header-cta">
      <a routerLink="/donate" class="btn-donate">
        <img src="https://www.helpageindia.org/wp-content/uploads/2024/09/heart-donate.png" alt="" />
        Donate
      </a>
      <button class="mobile-toggle" (click)="toggleMobile()" aria-label="Toggle menu">
        <span class="burger" [class.open]="mobileMenuOpen">
          <span></span><span></span><span></span>
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <nav class="mobile-nav" [class.open]="mobileMenuOpen" aria-label="Mobile Navigation">
    <ul>
      <li><a routerLink="/home" (click)="closeMobile()"><i class="fa-solid fa-house fa-fw menu-icon"></i> Home</a></li>
      <li><a routerLink="/about-us" (click)="closeMobile()"><i class="fa-solid fa-circle-info fa-fw menu-icon"></i> About Us</a></li>
      <li><a routerLink="/gallery" (click)="closeMobile()"><i class="fa-solid fa-images fa-fw menu-icon"></i> Gallery</a></li>
      <li><a routerLink="/impact-stories" (click)="closeMobile()"><i class="fa-solid fa-star fa-fw menu-icon"></i> Impact Stories</a></li>
      <li><a routerLink="/get-involved" (click)="closeMobile()"><i class="fa-solid fa-handshake-angle fa-fw menu-icon"></i> Get Involved</a></li>
      <li><a routerLink="/blog" (click)="closeMobile()"><i class="fa-solid fa-pen-to-square fa-fw menu-icon"></i> Blog</a></li>
      <li><a routerLink="/contact" (click)="closeMobile()"><i class="fa-solid fa-phone fa-fw menu-icon"></i> Contact</a></li>
      <li class="mobile-donate-li"><a routerLink="/donate" class="mobile-donate-btn" (click)="closeMobile()"><i class="fa-solid fa-heart fa-fw menu-icon"></i> Donate Now</a></li>
    </ul>
  </nav>
</header>
