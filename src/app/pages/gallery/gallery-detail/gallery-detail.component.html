<div *ngIf="loading" class="detail-loader">Loading details...</div>

<div class="container back-nav">
    <a routerLink="/gallery" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Back to Gallery
    </a>
</div>

<article class="gallery-article" *ngIf="!loading && gallery">
    <div class="container">
        <!-- Main Image -->
        <div class="main-image-container" *ngIf="gallery.images && gallery.images.length > 0">
            <img [src]="apiService.storageUrl + gallery.images[0].image" [alt]="gallery.event_name" class="main-img">
        </div>
    </div>

    <div class="container detail-content">
        <h1 class="gallery-title">{{ gallery.event_name }}</h1>
        <div class="gallery-desc" [innerHTML]="gallery.description"></div>

        <hr class="section-divider">

        <h2 class="gallery-subtitle">Event Photos</h2>
        <div class="related-images-grid">
            <div class="image-card" *ngFor="let img of gallery.images" (click)="openModal(apiService.storageUrl + img.image)">
                <img [src]="apiService.storageUrl + img.image" [alt]="gallery.event_name" loading="lazy">
                <div class="image-overlay">
                    <i class="fa-solid fa-expand"></i>
                </div>
            </div>
        </div>
    </div>
</article>

<!-- Full Screen Modal -->
<div class="image-modal" *ngIf="selectedImageUrl" (click)="closeModal()">
    <button class="close-btn" (click)="closeModal()">&times;</button>
    <div class="modal-content" (click)="$event.stopPropagation()">
        <img [src]="selectedImageUrl" alt="Full screen preview">
    </div>
</div>
